x-dev-build: &dev-build
  context: .
  dockerfile: docker/dev.Dockerfile

x-dev-volumes: &dev-volumes
  - .:/app
  - dev-root-node-modules:/app/node_modules
  - dev-frontend-node-modules:/app/frontend/node_modules
  - dev-gateway-node-modules:/app/backend-api-gateway/node_modules
  - dev-auth-node-modules:/app/backend-api-auth/node_modules
  - dev-frontend-next:/app/frontend/.next
  - dev-auth-prisma:/app/backend-api-auth/src/generated/prisma

services:
  backend-api-auth:
    image: f1-system-dev:local
    build: *dev-build
    command: ["sh", "-c", "pnpm --filter @gem-crm/backend-api-auth db:generate && pnpm --filter @gem-crm/backend-api-auth db:migrate && pnpm --filter @gem-crm/backend-api-auth dev"]
    environment:
      NODE_ENV: development
    volumes: *dev-volumes

  backend-api-gateway:
    image: f1-system-dev:local
    build: *dev-build
    command: ["pnpm", "--filter", "@gem-crm/backend-api-gateway", "dev"]
    environment:
      NODE_ENV: development
    volumes: *dev-volumes

  frontend:
    image: f1-system-dev:local
    build: *dev-build
    command: ["pnpm", "--filter", "frontend", "dev"]
    environment:
      NODE_ENV: development
    volumes: *dev-volumes

volumes:
  dev-root-node-modules:
  dev-frontend-node-modules:
  dev-gateway-node-modules:
  dev-auth-node-modules:
  dev-frontend-next:
  dev-auth-prisma:
